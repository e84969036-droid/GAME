<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>易經六十四卦考驗</title>
    <style>
        :root {
            --bg-color: #f4efe6;
            --card-bg: #fffcf7;
            --primary-color: #4a3728;
            --accent-color: #8c2d19;
            --correct-color: #2e7d32;
            --wrong-color: #c62828;
            --explanation-bg: #efe8d8;
        }

        body {
            font-family: "PingFang TC", "Microsoft JhengHei", serif;
            background-color: var(--bg-color);
            color: var(--primary-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .game-container {
            background-color: var(--card-bg);
            border: 2px solid var(--primary-color);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            width: 100%;
            max-width: 480px;
            padding: 24px;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 1.8rem;
            letter-spacing: 2px;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
        }

        .score-board {
            font-size: 1.1rem;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .gua-display {
            background-color: #eae3d2;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .gua-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .gua-symbol {
            font-size: 3.5rem;
            line-height: 1;
            margin-bottom: 8px;
        }

        .gua-label {
            font-size: 0.9rem;
            color: #666;
        }

        .plus-sign {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background-color: var(--card-bg);
            border: 2px solid var(--primary-color);
            border-radius: 8px;
            padding: 14px 8px;
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--primary-color);
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .option-btn:hover:not(:disabled) {
            background-color: var(--primary-color);
            color: #fff;
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .option-btn.correct {
            background-color: var(--correct-color) !important;
            color: white !important;
            border-color: var(--correct-color) !important;
        }

        .option-btn.wrong {
            background-color: var(--wrong-color) !important;
            color: white !important;
            border-color: var(--wrong-color) !important;
        }

        .message {
            min-height: 28px;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 16px;
        }

        /* 象曰與解卦卡片 */
        .explanation-card {
            display: none;
            background-color: var(--explanation-bg);
            border-left: 4px solid var(--accent-color);
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 20px;
            text-align: left;
            animation: fadeIn 0.4s ease-in-out;
        }

        .explanation-card h3 {
            margin: 0 0 8px 0;
            font-size: 1.1rem;
            color: var(--accent-color);
        }

        .explanation-card p {
            margin: 6px 0;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .xiang-text {
            font-weight: bold;
            color: #333;
        }

        .next-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            display: none;
            margin: 0 auto;
            font-family: inherit;
        }

        .next-btn:hover {
            opacity: 0.9;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>易經 64 卦對對碰</h1>
    <div class="score-board">得分：<span id="score">0</span></div>

    <div class="gua-display">
        <div class="gua-box">
            <div class="gua-symbol" id="upper-symbol">☰</div>
            <div class="gua-label">上卦（外卦）</div>
            <div style="font-weight: bold;" id="upper-name">乾</div>
        </div>
        <div class="plus-sign">+</div>
        <div class="gua-box">
            <div class="gua-symbol" id="lower-symbol">☷</div>
            <div class="gua-label">下卦（內卦）</div>
            <div style="font-weight: bold;" id="lower-name">坤</div>
        </div>
    </div>

    <div class="message" id="message">請選擇合成後的卦名：</div>

    <div class="options-grid" id="options">
        <!-- 4個選項按鈕動態生成 -->
    </div>

    <!-- 答對時說明的區塊 -->
    <div class="explanation-card" id="explanation-card">
        <h3 id="exp-title">【天地否】</h3>
        <p class="xiang-text">象曰：<span id="exp-xiang"></span></p>
        <p><strong>白話解義：</strong><span id="exp-meaning"></span></p>
    </div>

    <button class="next-btn" id="next-btn" onclick="nextQuestion()">下一題</button>
</div>

<script>
    const bagua = [
        { name: '乾', symbol: '☰', nature: '天' },
        { name: '兌', symbol: '☱', nature: '澤' },
        { name: '離', symbol: '☲', nature: '火' },
        { name: '震', symbol: '☳', nature: '雷' },
        { name: '巽', symbol: '☴', nature: '風' },
        { name: '坎', symbol: '☵', nature: '水' },
        { name: '艮', symbol: '☶', nature: '山' },
        { name: '坤', symbol: '☷', nature: '地' }
    ];

    // 64 卦資料庫（包含全名、簡稱、象曰與白話）
    const hexagrams = {
        '0_0': { fullName: '乾為天', shortName: '乾', xiang: '天行健，君子以自強不息。', meaning: '天道的運行剛強勁健，君子應效法天道，自立自強，永不停息。' },
        '0_1': { fullName: '天澤履', shortName: '履', xiang: '上天下澤，履。君子以辨上下，定民志。', meaning: '天在上、澤在下，尊卑有序。君子應辨明上下名份，穩定民眾志向。' },
        '0_2': { fullName: '天火同人', shortName: '同人', xiang: '天與火，同人。君子以類族辨物。', meaning: '天與火同向上升。君子應觀察事物種類，辨明異同，凝聚志同道合之人。' },
        '0_3': { fullName: '天雷無妄', shortName: '無妄', xiang: '天下雷行，物與無妄。先王以茂對時，育萬物。', meaning: '天下雷動，萬物順應自然而不妄為。君子應順應天時，順勢養育萬物。' },
        '0_4': { fullName: '天風姤', shortName: '姤', xiang: '天下有風，姤。后以施命誥四方。', meaning: '風在天下吹拂，無所不至。君子應如風般頒布命令，通達四方。' },
        '0_5': { fullName: '天水訟', shortName: '訟', xiang: '天與水違行，訟。君子以作事謀始。', meaning: '天向上升、水向下流，背道而馳。君子做事應在開頭就謀劃周詳，避免爭訟。' },
        '0_6': { fullName: '天山遯', shortName: '遯', xiang: '天下有山，遯。君子以遠小人，不惡而嚴。', meaning: '天下有山，山再高也觸不到天。君子應遠離小人，保持距離且態度嚴肅。' },
        '0_7': { fullName: '天地否', shortName: '否', xiang: '天地不交，否。君子以儉德辟難，不可榮以祿。', meaning: '天地之氣不相通，萬物閉塞。君子應收斂德行以避災難，不貪圖祿位。' },

        '1_0': { fullName: '澤天夬', shortName: '夬', xiang: '澤上於天，夬。君子以施祿及下，居德則忌。', meaning: '澤水升於天上，有決口下潰之勢。君子應廣施恩澤給下屬，切忌居功自傲。' },
        '1_1': { fullName: '兌為澤', shortName: '兌', xiang: '麗澤，兌。君子以朋友講習。', meaning: '兩澤相連，互相滋潤。君子應與朋友聚在一起交流研討，共同進步。' },
        '1_2': { fullName: '澤火革', shortName: '革', xiang: '澤中有火，革。君子以治歷明時。', meaning: '水火相息，變革之象。君子應順應時勢進行改革，如制定歷法釐清時節。' },
        '1_3': { fullName: '澤雷歸妹', shortName: '歸妹', xiang: '澤上有雷，歸妹。君子以永終知敝。', meaning: '澤上有雷動，象徵婚姻少女隨姊嫁人。君子做事應看清長遠後果，防止弊端。' },
        '1_4': { fullName: '澤風大過', shortName: '大過', xiang: '澤滅木，大過。君子以獨立不懼，遁世無悶。', meaning: '澤水淹沒樹木，負擔過重。君子應能獨立不懼，隱居不出也無所煩悶。' },
        '1_5': { fullName: '澤水困', shortName: '困', xiang: '澤無水，困。君子以致命遂志。', meaning: '澤中無水，陷入困境。君子在困境中應寧死不屈，實現自己的志向。' },
        '1_6': { fullName: '澤山鹹', shortName: '鹹', xiang: '山上有澤，鹹。君子以虛受人。', meaning: '山頂有澤，山虛才能容水。君子應虛懷若谷，謙虛地接受他人的意見。' },
        '1_7': { fullName: '澤地萃', shortName: '萃', xiang: '澤上於地，萃。君子以除戎器，戒不虞。', meaning: '澤水聚於地上，聚集之象。君子應修繕兵器防範未然，警惕突發事件。' },

        '2_0': { fullName: '火天大有', shortName: '大有', xiang: '火在天上，大有。君子以遏惡揚善，順天休命。', meaning: '太陽普照天下，大有收穫。君子應遏止邪惡、揚善舉，順應天命。' },
        '2_1': { fullName: '火澤睽', shortName: '睽', xiang: '上火下澤，睽。君子以同而異。', meaning: '火向上炎，澤水向下流，二者背道而馳。君子應在大同中求同存異。' },
        '2_2': { fullName: '離為火', shortName: '離', xiang: '明兩作，離。大人以繼明照於四方。', meaning: '光明接連升起。偉大人物應延續這份光明，照亮四方。' },
        '2_3': { fullName: '火雷噬嗑', shortName: '噬嗑', xiang: '雷電噬嗑。先王以明罰勅法。', meaning: '雷電交加，如咬碎障礙。先王應嚴明賞罰，整頓法令。' },
        '2_4': { fullName: '火風鼎', shortName: '鼎', xiang: '木上有火，鼎。君子以正位凝命。', meaning: '木上有火，如鼎煮物革故鼎新。君子應端正職位，安奉天命。' },
        '2_5': { fullName: '火水未濟', shortName: '未濟', xiang: '火在水上，未濟。君子以慎辨物居方。', meaning: '火在水上無法相交，事業尚未完成。君子應謹慎辨別事物，安放得當。' },
        '2_6': { fullName: '火山旅', shortName: '旅', xiang: '山上有火，旅。君子以明慎用刑，而不留獄。', meaning: '山上有火，火勢蔓延不停留。君子審案應明察謹慎，不拖延判決。' },
        '2_7': { fullName: '火地晉', shortName: '晉', xiang: '明出地上，晉。君子以自昭明德。', meaning: '太陽升起在地面上，象徵前進順遂。君子應自我昭顯光明的德行。' },

        '3_0': { fullName: '雷天大壯', shortName: '大壯', xiang: '雷在天上，大壯。君子以非禮弗履。', meaning: '雷響徹雲霄，盛大壯美。君子應恪守禮節，不合乎禮的事絕不做。' },
        '3_1': { fullName: '雷澤歸妹', shortName: '歸妹', xiang: '澤上有雷，歸妹。君子以永終知敝。', meaning: '澤上有雷動。君子應考量事情長遠的發展，預先防範後患。' },
        '3_2': { fullName: '雷火豐', shortName: '豐', xiang: '雷電皆至，豐。君子以折獄致刑。', meaning: '雷電交加，聲勢隆盛豐沛。君子應明察秋毫，公平公正地審理案件。' },
        '3_3': { fullName: '震為雷', shortName: '震', xiang: '濬雷，震。君子以恐懼脩省。', meaning: '接連的雷聲響起。君子應保持敬畏之心，隨時反省修養自身。' },
        '3_4': { fullName: '雷風恆', shortName: '恆', xiang: '雷風，恆。君子以立不易方。', meaning: '雷與風互相助長，持之以恆。君子應立定志向，堅守原則絕不改變。' },
        '3_5': { fullName: '雷水解', shortName: '解', xiang: '雷雨作，解。君子以赦過宥罪。', meaning: '雷雨交加，解除悶熱鬱結。君子應寬恕他人的過錯，赦免罪過。' },
        '3_6': { fullName: '雷山小過', shortName: '小過', xiang: '山上有雷，小過。君子以行過乎恭，喪過乎哀，用過乎儉。', meaning: '山上有雷聲。君子行為宜過於謙恭，喪事宜過於哀傷，費用宜過於節儉。' },
        '3_7': { fullName: '雷地豫', shortName: '豫', xiang: '雷出地奮，豫。先王以作樂崇德，殷薦之上帝。', meaning: '雷從地下響起，大地振動歡愉。先王製作音樂尊崇美德，祭祀天神。' },

        '4_0': { fullName: '風天小畜', shortName: '小畜', xiang: '風行天上，小畜。君子以懿文德。', meaning: '風吹行於高空，蓄積未大。君子應修飾文采與道德，蓄積實力。' },
        '4_1': { fullName: '風澤中孚', shortName: '中孚', xiang: '澤上有風，中孚。君子以議論獄緩死。', meaning: '風吹拂在水面上，誠信感應。君子審判案件應嚴謹討論，寬緩死刑。' },
        '4_2': { fullName: '風火家人', shortName: '家人', xiang: '風自火出，家人。君子以言有物，而行有恆。', meaning: '風由火熱之氣產生，由內而外。君子說話要有根據，行為要有常規。' },
        '4_3': { fullName: '風雷益', shortName: '益', xiang: '風雷，益。君子以見善則遷，有過則改。', meaning: '風與雷相互助長，有增益之象。君子看見善行就學習，有了過錯就改正。' },
        '4_4': { fullName: '巽為風', shortName: '巽', xiang: '隨風，巽。君子以申命行事。', meaning: '微風相隨吹拂。君子應反覆申明政令，並確實貫徹執行。' },
        '4_5': { fullName: '風水渙', shortName: '渙', xiang: '風行水上，渙。先王以享於上帝立廟。', meaning: '風吹水面波紋散開，渙散之象。先王祭祀上帝建立宗廟，凝聚人心。' },
        '4_6': { fullName: '風山漸', shortName: '漸', xiang: '山上有木，漸。君子以居賢德，善俗。', meaning: '山上的樹木緩慢生長，漸進之象。君子應保持賢德，改善社會風俗。' },
        '4_7': { fullName: '風地觀', shortName: '觀', xiang: '風行地上，觀。先王以省方觀民設教。', meaning: '風吹拂在大地上，觀察萬物。先王巡視四方觀察民情，施行教育。' },

        '5_0': { fullName: '水天需', shortName: '需', xiang: '雲上於天，需。君子以飲食宴樂。', meaning: '雲氣升到天上等待降雨，等待之象。君子應安閒飲食宴樂，養精蓄銳。' },
        '5_1': { fullName: '水澤節', shortName: '節', xiang: '澤上有水，節。君子以制數度，議德行。', meaning: '水在澤中，容量有限。君子應制定制度規範，討論道德行為。' },
        '5_2': { fullName: '水火既濟', shortName: '既濟', xiang: '水在火上，既濟。君子以思患而豫防之。', meaning: '水在火上，煮物已熟，成功之象。君子應在成功時考慮隱患，預先防範。' },
        '5_3': { fullName: '水雷屯', shortName: '屯', xiang: '雲雷，屯。君子以經綸。', meaning: '雲雷交加，萬物萌芽艱難。君子應著手經綸籌劃，奠定基業。' },
        '5_4': { fullName: '水風井', shortName: '井', xiang: '木上有水，井。君子以勞民勸相。', meaning: '木桶汲水而出，養人無窮。君子應慰勞民眾，勉勵大家互相幫助。' },
        '5_5': { fullName: '坎為水', shortName: '坎', xiang: '水洊至，習坎。君子以常德行，習教事。', meaning: '水流源源不絕，歷經險阻。君子應保持長久的德行，熟練教化事業。' },
        '5_6': { fullName: '水山蹇', shortName: '蹇', xiang: '山上有水，蹇。君子以反身修德。', meaning: '山上有水阻隔，行路艱難。君子遇阻應反省自身，修養德行。' },
        '5_7': { fullName: '水地比', shortName: '比', xiang: '地上有水，比。先王以建萬國，親諸侯。', meaning: '地上有水，相依相親。先王建立萬國，親近封賞諸侯。' },

        '6_0': { fullName: '山天大畜', shortName: '大畜', xiang: '天在山中，大畜。君子以多識前言往行，以畜其德。', meaning: '天被包容在山中，蓄積巨大。君子應多記前人言行，累積自己的德行。' },
        '6_1': { fullName: '山澤損', shortName: '損', xiang: '山下有澤，損。君子以懲忿窒慾。', meaning: '山下有澤，澤水浸蝕山腳。君子應克制忿怒，節制慾望。' },
        '6_2': { fullName: '山火賁', shortName: '賁', xiang: '山下有火，賁。君子以明庶政，無敢折獄。', meaning: '山下有火光明照耀，飾文之象。君子應明察各項政務，但不輕率判決重罪。' },
        '6_3': { fullName: '山雷頤', shortName: '頤', xiang: '山下有雷，頤。君子以慎言語，節飲食。', meaning: '山下有雷，如口含物。君子說話要謹慎，飲食要有節制。' },
        '6_4': { fullName: '山風蠱', shortName: '蠱', xiang: '山下有風，蠱。君子以振民育德。', meaning: '山下風不流通，易生蟲腐敗。君子應振奮民心，培養道德整頓弊端。' },
        '6_5': { fullName: '山水蒙', shortName: '蒙', xiang: '山下出泉，蒙。君子以果行育德。', meaning: '山下流出泉水，啟蒙之象。君子應果斷行動，培育美德。' },
        '6_6': { fullName: '艮為山', shortName: '艮', xiang: '兼山，艮。君子以思不出其位。', meaning: '重重山峰矗立，靜止之象。君子思考問題不超越自己的本分。' },
        '6_7': { fullName: '山地剝', shortName: '剝', xiang: '山附於地，剝。上以厚下安宅。', meaning: '山依附於大地，侵蝕剝落。上位者應厚待下屬，才能安居樂業。' },

        '7_0': { fullName: '地天泰', shortName: '泰', xiang: '天地交，泰。后以裁成天地之道，輔相天地之宜，以左右民。', meaning: '天降地升，天地之氣相交通泰。君子應裁成天地規律，輔佐導引民眾。' },
        '7_1': { fullName: '地澤臨', shortName: '臨', xiang: '澤上有地，臨。君子以教思無窮，容保民無疆。', meaning: '大地居於澤上，居高臨下。君子教導民眾思慮無窮，容納保護人民無邊無際。' },
        '7_2': { fullName: '地火明夷', shortName: '明夷', xiang: '明入地中，明夷。君子以蒞眾，用晦而明。', meaning: '光明沉入地底，黑暗之象。君子治理大眾應外表收斂光芒，內心保持明察。' },
        '7_3': { fullName: '地雷復', shortName: '復', xiang: '雷在地中，復。先王以至日閉關，商旅不行，后不省方。', meaning: '雷藏於地下，陽氣復甦。先王在冬至日關閉城門，商旅不出，不上朝巡視。' },
        '7_4': { fullName: '地風升', shortName: '升', xiang: '地中生木，升。君子以順德，積小以高大。', meaning: '樹木在地下發芽向上生長。君子應順應德行，積累小善以成就高大。' },
        '7_5': { fullName: '地水師', shortName: '師', xiang: '地中有水，師。君子以容民蓄眾。', meaning: '地底藏有水，聚眾之象。君子應容納民眾，養育眾人。' },
        '7_6': { fullName: '地山謙', shortName: '謙', xiang: '地中有山，謙。君子以裒多益寡，稱物平施。', meaning: '高山隱於地底，謙遜之象。君子應減少多餘補助不足，衡量事物公平施予。' },
        '7_7': { fullName: '坤為地', shortName: '坤', xiang: '地勢坤，君子以厚德載物。', meaning: '大地形勢舒展順從。君子應增厚美德，容載萬物。' }
    };

    let score = 0;
    let currentGuaData = null;

    function initGame() {
        score = 0;
        document.getElementById('score').innerText = score;
        nextQuestion();
    }

    function nextQuestion() {
        // 重設 UI
        document.getElementById('message').innerText = '請選擇合成後的卦名：';
        document.getElementById('message').style.color = 'var(--primary-color)';
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('explanation-card').style.display = 'none';

        // 隨機抽選上卦與下卦 (0-7)
        const upperIdx = Math.floor(Math.random() * 8);
        const lowerIdx = Math.floor(Math.random() * 8);

        const upper = bagua[upperIdx];
        const lower = bagua[lowerIdx];

        // 顯示上卦與下卦
        document.getElementById('upper-symbol').innerText = upper.symbol;
        document.getElementById('upper-name').innerText = `${upper.name}(${upper.nature})`;
        document.getElementById('lower-symbol').innerText = lower.symbol;
        document.getElementById('lower-name').innerText = `${lower.name}(${lower.nature})`;

        // 正確答案數據
        currentGuaData = hexagrams[`${upperIdx}_${lowerIdx}`];

        // 產生 4 個選項 (僅顯示 shortName)
        const options = [currentGuaData.shortName];
        const allList = Object.values(hexagrams);

        while (options.length < 4) {
            const randomItem = allList[Math.floor(Math.random() * allList.length)];
            if (!options.includes(randomItem.shortName)) {
                options.push(randomItem.shortName);
            }
        }

        // 打亂選項順序
        options.sort(() => Math.random() - 0.5);

        // 渲染選項按鈕
        const optionsContainer = document.getElementById('options');
        optionsContainer.innerHTML = '';

        options.forEach(shortName => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = shortName;
            btn.onclick = () => checkAnswer(btn, shortName);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedBtn, selectedValue) {
        const buttons = document.querySelectorAll('.option-btn');
        
        // 禁用所有按鈕
        buttons.forEach(btn => btn.disabled = true);

        const messageEl = document.getElementById('message');

        if (selectedValue === currentGuaData.shortName) {
            selectedBtn.classList.add('correct');
            messageEl.innerText = '🎉 答對了！';
            messageEl.style.color = 'var(--correct-color)';
            score += 10;
            document.getElementById('score').innerText = score;

            // 顯示答對時的「象曰」與解義卡片
            document.getElementById('exp-title').innerText = `【${currentGuaData.fullName}】`;
            document.getElementById('exp-xiang').innerText = currentGuaData.xiang;
            document.getElementById('exp-meaning').innerText = currentGuaData.meaning;
            document.getElementById('explanation-card').style.display = 'block';

        } else {
            selectedBtn.classList.add('wrong');
            messageEl.innerText = `❌ 答錯了！正確答案是「${currentGuaData.shortName}」（${currentGuaData.fullName}）`;
            messageEl.style.color = 'var(--wrong-color)';
            
            // 標示出正確答案
            buttons.forEach(btn => {
                if (btn.innerText === currentGuaData.shortName) {
                    btn.classList.add('correct');
                }
            });
        }

        // 顯示下一題按鈕
        document.getElementById('next-btn').style.display = 'block';
    }

    // 初始化啟動遊戲
    initGame();
</script>
